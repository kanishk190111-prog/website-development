<!DOCTYPE html>
<html>
    <head>
        <title>My Animal Fact File</title>
        <style>
            /*Page background */
            body {
                background-color: darkgreen;
                font-family: Arial, sans-serif;
            }

            /*Box Model*/
            .fact-file {
                background-color: Lightyellow;
                color: darkslategray;
                width: 260px;
                padding: 25px;
                border: 4px solid forestgreen;
                margin: 30px;
            }

            /* Animal name*/
            .animal-name {
                color: forestgreen;
                font-size: 22px;
            }

            /*Detail rows*/
            .detail {
                color: darkslategray;
            }

            /* Cool fact*/
            .cool-fact {
                color: darkorange;
                font-style: italic;
            }
        </style>
    </head>
    <body>
        
        <div class="fact-file">
            <h2 class="animal-name">Snow Leopard</h2>
            <p class="detail">Type: Big Cat</p>
            <p class="detail">Lives in: Mountain ranges of Central Asia</p>
            <p class="detail">Diet: Deer, goat, and wild sheep</p>
            <p class="cool-fact">Cool Fact: Can leap up to 15 metres in one jump!</p>
        </div>

    </body>
</html>
