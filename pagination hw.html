<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Different Bootstrap Pagination</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container py-5">

    <h2 class="text-center mb-4">Different Bootstrap Pagination Styles</h2>

    <!-- Basic Pagination -->
    <h4>1. Basic Pagination</h4>
    <nav>
        <ul class="pagination">
            <li class="page-item"><a class="page-link" href="#">Previous</a></li>
            <li class="page-item"><a class="page-link" href="#">1</a></li>
            <li class="page-item active"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">3</a></li>
            <li class="page-item"><a class="page-link" href="#">Next</a></li>
        </ul>
    </nav>

    <!-- Colored Pagination -->
    <h4>2. Colored Pagination</h4>
    <nav>
        <ul class="pagination">
            <li class="page-item">
                <a class="page-link bg-primary text-white" href="#">1</a>
            </li>
            <li class="page-item">
                <a class="page-link bg-success text-white" href="#">2</a>
            </li>
            <li class="page-item">
                <a class="page-link bg-danger text-white" href="#">3</a>
            </li>
        </ul>
    </nav>

    <!-- Large Pagination -->
    <h4>3. Large Pagination</h4>
    <nav>
        <ul class="pagination pagination-lg">
            <li class="page-item"><a class="page-link" href="#">1</a></li>
            <li class="page-item active"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">3</a></li>
        </ul>
    </nav>

    <!-- Small Pagination -->
    <h4>4. Small Pagination</h4>
    <nav>
        <ul class="pagination pagination-sm">
            <li class="page-item"><a class="page-link" href="#">1</a></li>
            <li class="page-item active"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">3</a></li>
        </ul>
    </nav>

</body>

</html>
