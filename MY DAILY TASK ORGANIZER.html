<!DOCTYPE html>
<html>

<head>
    <title>My Daily Task Organizer</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

</head>

<body class="p-4">

<body>

    <h1>My Daily Task Organizer</h1>
    

    <h3>Add Task</h3>

    <label>Task Name:</label>
    <input type="text" placeholder="Enter task name">
    <br><br>

    <label>Task Time:</label>
    <input type="time">
    <br><br>

    <!-- TOPIC 4:map() -->
    <div class="card mb-4">
        <div class="card-body">
            <h3 class="card-title">Label Every Task</h3>
            <button class="btn btn-primary" onclick="addLabel()">Add Tasks Label</button>
            <div id="LabelResult" class="box p-3 mt-3 rounded"></div>
        </div>

    <h3>Task List</h3>

    <ul>
        <li>Wake Up - 6:00 AM</li>
        <li>Study - 9:00 AM</li>
        <li>Lunch - 1:00 PM</li>
    </ul>

    <button>Add Task</button><br>
    <button>Sort Tasks</button><br>
    <button>Reverse Tasks</button><br>

</body>

</html>
