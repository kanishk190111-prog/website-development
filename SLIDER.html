<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">
        <h1 class="text-center mb-4">Nature Image Slider</h1>

        <div id="mySlider" class="carousel slide" data-bs-ride="carousel">

            <!-- Indicators -->
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#mySlider" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#mySlider" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#mySlider" data-bs-slide-to="2"></button>
            </div>

            <!-- Images -->
            <div class="carousel-inner">

                <div class="carousel-item active">
                    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1200" class="d-block w-100"
                        alt="Nature" height="500">
                </div>

                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1200" class="d-block w-100"
                        alt="Mountain" height="500">
                </div>

                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1200" class="d-block w-100"
                        alt="Forest" height="500">
                </div>

            </div>

            <!-- Previous Button -->
            <button class="carousel-control-prev" type="button" data-bs-target="#mySlider" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>

            <!-- Next Button -->
            <button class="carousel-control-next" type="button" data-bs-target="#mySlider" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
