<!DOCTYPE html>
<html>

<head>
    <title>Birthday Countdown Checker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url(bday.jpeg);
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 400px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 0px 15px gray;
        }

        h1 {
            color: #ff4081;
        }

        p {
            color: #444;
        }

        input {
            padding: 10px;
            width: 220px;
            font-size: 16px;
            margin: 15px 0;
            border-radius: 5px;
            border: 1px solid gray;
        }

        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #388E3C;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            color: #e91e63;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1> Birthday Countdown Checker </h1>

        <p>Select your birthday:</p>

        <input type="date" id="birthday"><br>

        <button onclick="countdown()">Check Countdown</button>

        <div id="result"></div>

    </div>

    <script>

        function countdown() {

            var birth = document.getElementById("birthday").value;

            if (birth == "") {
                document.getElementById("result").innerHTML = "Please select your birthday!";
                return;
            }

            var birthday = new Date(birth);
            var today = new Date();

            var nextBirthday = new Date(
                today.getFullYear(),
                birthday.getMonth(),
                birthday.getDate()
            );

            if (nextBirthday < today) {
                nextBirthday.setFullYear(today.getFullYear() + 1);
            }

            var difference = nextBirthday - today;

            var daysLeft = Math.ceil(difference / (1000 * 60 * 60 * 24));

            if (daysLeft == 0) {
                document.getElementById("result").innerHTML = " Happy Birthday! Have a Wonderful Day! ";
            }
            else {
                document.getElementById("result").innerHTML = " Only <b>" + daysLeft + "</b> day(s) left until your birthday!";
            }

        }

    </script>

</body>

</html>
