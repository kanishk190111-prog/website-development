<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: Arial;
            background: aliceblue;
            text-align: center;
            padding: 30px
        }

        h1 {
            color: navy
        }

        input {
            padding: 8px;
            margin: 5px;
            border: 2px solid navy;
            border-radius: 6px;
            width: 220px
        }

        button {
            background: navy;
            color: #fff;
            padding: 10px 25px;
            border: none;
            border-radius: 20px;
            cursor: pointer
        }

        #timer {
            color: grey
        }
    </style>
</head>

<body>

    <h1>Lucky Draw</h1>
    <p>Enter your name and guess a number to win!</p>

    <input type="text" id="name" placeholder="Your name"><br>
    <p id="msg-name"></p>

    <input type="number" id="guess" placeholder="Guess (1-5)" min="1" max="5"><br>
    <p id="msg-guess"></p>

    <button onclick="checkForm()">Try My Luck!</button>

    <p id="result"></p>
    <p id="timer"></p>

    <script>
        let s = 0;

        setInterval(() => {
            s++;
            document.getElementById("timer").innerHTML = "You have been here for " + s + " seconds!";
        }, 1000);

        function checkForm() {

            let n = document.getElementById("name").value;
            let g = document.getElementById("guess").value;

            let msgName = document.getElementById("msg-name");
            let msgGuess = document.getElementById("msg-guess");
            let result = document.getElementById("result");

            let ok = true;

            if (n == "") {
                msgName.innerHTML = "Please enter your name!";
                msgName.style.color = "red";
                ok = false;
            }
            else {
                msgName.innerHTML = "Great name!";
                msgName.style.color = "green";
            }

            if (g == "") {
                msgGuess.innerHTML = "Please enter your guess!";
                msgGuess.style.color = "red";
                ok = false;
            }
            else {
                msgGuess.innerHTML = "Guess saved!";
                msgGuess.style.color = "green";
            }

            if (ok) {
                let lucky = Math.floor(Math.random() * 5) + 1;

                if (Number(g) === lucky) {
                    result.innerHTML = `You win, ${n}! The lucky number was ${lucky}!`;
                    result.style.color = "green";
                }
                else {
                    result.innerHTML = `So close, ${n}! The lucky number was ${lucky}. Try again!`;
                    result.style.color = "navy";
                }
            }
        }
    </script>

</body>

</html>
