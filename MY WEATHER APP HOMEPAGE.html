<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Weather App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            background-color: #87ceeb;

            /* Patterned Background */
            background-image:
                radial-gradient(white 2px, transparent 2px),
                radial-gradient(white 2px, transparent 2px);

            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Weather Card */
        .weather-card {
            width: 350px;
            padding: 25px;
            border-radius: 20px;

            /* Gradient Background */
            background: linear-gradient(to bottom, #4facfe, #00f2fe);

            color: white;
            text-align: center;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);

            position: relative;
            overflow: hidden;
        }

        /* Floating Sun Animation */
        .sun {
            width: 80px;
            height: 80px;
            background: yellow;
            border-radius: 50%;
            margin: 10px auto;

            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }

            100% {
                transform: translateY(0);
            }
        }

        h1 {
            margin-top: 10px;
            font-size: 32px;
        }

        h2 {
            margin: 10px 0;
            font-size: 22px;
        }

        p {
            margin-bottom: 20px;
            font-size: 18px;
        }

        /* Weekly Forecast */
        .forecast {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .day {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 10px;
            width: 60px;
        }

        .day h3 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .day p {
            font-size: 14px;
            margin: 0;
        }
    </style>
</head>

<body>

    <div class="weather-card">

        <div class="sun"></div>

        <h1>28°C</h1>
        <h2>Kathmandu</h2>
        <p>Sunny Weather</p>

        <div class="forecast">

            <div class="day">
                <h3>Mon</h3>
                <p>26°C</p>
            </div>

            <div class="day">
                <h3>Tue</h3>
                <p>27°C</p>
            </div>

            <div class="day">
                <h3>Wed</h3>
                <p>29°C</p>
            </div>

            <div class="day">
                <h3>Thu</h3>
                <p>25°C</p>
            </div>

        </div>

    </div>

</body>

</html>
