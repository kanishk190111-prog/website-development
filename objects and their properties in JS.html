<!DOCTYPE html>
<html>
    <body>
        <h2>JavaScript Objects and its Properties</h2>
        <p> Instead of saving lots of separate variables, an object holds related information and actions together in one place.</p>
        <p id="demo"></p>
        <script>
            var person={
                    firstname: "I",
                age:16};
            
                document.getElementById("demo").innerHTML= person.firstname + "am" + person.age + "years old";
        </script>
    </body>
</html>
