<!DOCTYPE html>
<html>

<head>
    <title>SpongeBob Character Card</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial;
            text-align: center;
        }

        .card {
            width: 300px;
            background-color: white;
            margin: 50px auto;
            padding: 20px;
            border-radius: 15px;
            border: 3px solid yellow;
        }

        img {
            width: 200px;
            border-radius: 10px;
        }

        h1 {
            color: orange;
        }

        p {
            color: black;
            font-size: 18px;
        }

        .power {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>SpongeBob SquarePants</h1>

        <img src="https://upload.wikimedia.org/wikipedia/en/3/33/SpongeBob_SquarePants_character.svg" alt="SpongeBob">

        <p>Hello! I live in Bikini Bottom and work at the Krusty Krab.</p>

        <p class="power">Special Skill: Making Krabby Patties 🍔</p>
    </div>

</body>

</html>
